name: Installer bauen (Windows und Mac)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LLAMA_CPP_TAG: b12530 # fertige Windows-Version (Vulkan, läuft auf AMD/NVIDIA/Intel), fest angepinnt
      PTTS_TAG: v0.7.1 # Phonon-Laufzeit (gradium-ai/xn-ptts), fest angepinnt
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Eigene Engine (llama.cpp, Vulkan) laden
        shell: bash
        run: |
          mkdir -p llama-dl build-bundled/llama
          gh release download "$LLAMA_CPP_TAG" --repo ggml-org/llama.cpp --pattern "llama-*-bin-win-vulkan-x64.zip" --dir llama-dl
          ls -la llama-dl
          7z x -y llama-dl/*.zip -obuild-bundled/llama > /dev/null
          find build-bundled/llama -name llama-server.exe
          test -f build-bundled/llama/llama-server.exe
          echo "$LLAMA_CPP_TAG" > build-bundled/llama/VERSION
      - name: Sprachausgabe Phonon (ptts) laden
        shell: bash
        run: |
          mkdir -p ptts-dl ptts-x build-bundled/ptts
          gh release download "$PTTS_TAG" --repo gradium-ai/xn-ptts --pattern "ptts-*-x86_64-pc-windows-msvc.zip" --pattern SHA256SUMS --dir ptts-dl
          (cd ptts-dl && grep "x86_64-pc-windows-msvc.zip" SHA256SUMS | sha256sum -c -)
          7z x -y ptts-dl/*.zip -optts-x > /dev/null
          find ptts-x -name ptts.exe -exec cp {} build-bundled/ptts/ \;
          test -f build-bundled/ptts/ptts.exe
          echo "$PTTS_TAG" > build-bundled/ptts/VERSION
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prüfen, ob llama-server im Installer liegt
        shell: bash
        run: test -f dist/win-unpacked/resources/llama/llama-server.exe
      - name: Prüfen, ob Phonon (ptts) im Installer liegt
        shell: bash
        run: test -f dist/win-unpacked/resources/ptts/ptts.exe
      - name: App-Start prüfen (Fenster geht auf)
        shell: bash
        run: |
          EXE="$(ls dist/win-unpacked/*.exe | grep -v -i uninst | head -1)"
          R="$RUNNER_TEMP/smoke.txt"; rm -f "$R"
          FA_SMOKE="$R" timeout 120 "$EXE" || true
          cat "$R" || true
          grep -q FA_SMOKE_OK "$R"
      - name: Version ermitteln
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}
          path: dist/FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}.exe
          if-no-files-found: error
          retention-days: 1
        # Ist der Artefakt-Speicher des Kontos voll, soll der Build nicht scheitern (Testversion kommt dann per Prerelease).
        continue-on-error: true
      - name: Testversion als Prerelease bereitstellen
        if: github.ref != 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          F="dist/FA-KI-Desktop-Setup-$V.exe"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          gh release create "v$V-test" --prerelease --target "$SHA" --title "FA KI Desktop $V (Testversion)" --notes "Testversion aus einem Pull Request." >/dev/null 2>&1 || true
          gh release upload "v$V-test" "$F" --clobber
      - name: Release erstellen oder aktualisieren
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          F="dist/FA-KI-Desktop-Setup-$V.exe"
          gh release create "v$V" --target "${{ github.sha }}" --title "FA KI Desktop $V" --notes "Installationsprogramme für Windows und Mac." >/dev/null 2>&1 || true
          # Kein --clobber: ein veröffentlichtes Installationsprogramm wird nie still überschrieben.
          gh release upload "v$V" "$F" || echo "::warning::$F ist in Release v$V schon vorhanden – bitte die Version in package.json erhöhen."

  mac:
    runs-on: macos-latest # Apple Silicon (M1)
    timeout-minutes: 60
    env:
      LLAMA_CPP_TAG: b12530
      PTTS_TAG: v0.7.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sprachausgabe Phonon (ptts, Apple Silicon) laden
        run: |
          mkdir -p ptts-dl ptts-x mac-bundle/ptts
          gh release download "$PTTS_TAG" --repo gradium-ai/xn-ptts --pattern "ptts-*-aarch64-apple-darwin.tar.gz" --pattern SHA256SUMS --dir ptts-dl
          (cd ptts-dl && grep "aarch64-apple-darwin.tar.gz" SHA256SUMS | shasum -a 256 -c -)
          tar -xzf ptts-dl/*.tar.gz -C ptts-x
          cp "$(find ptts-x -type f -name ptts | head -1)" mac-bundle/ptts/ptts
          chmod +x mac-bundle/ptts/ptts
          echo "$PTTS_TAG" > mac-bundle/ptts/VERSION
      - name: Eigene Engine (llama.cpp, Metal) laden
        run: |
          mkdir -p llama-dl llama-x mac-bundle/llama
          gh release download "$LLAMA_CPP_TAG" --repo ggml-org/llama.cpp --pattern "llama-*-bin-macos-arm64.*" --dir llama-dl
          ls -la llama-dl
          for f in llama-dl/*; do
            case "$f" in
              *.zip) unzip -q -o "$f" -d llama-x ;;
              *.tar.gz|*.tgz) tar -xzf "$f" -C llama-x ;;
            esac
          done
          SRV=$(find llama-x -type f -name llama-server | head -1)
          test -n "$SRV"
          # Mit Symlinks kopieren (cp -a). Die Programme kommen erst nach electron-builder ins Paket, weil dessen Kopierschritt an den Symlinks scheitert.
          cp -a "$(dirname "$SRV")"/. mac-bundle/llama/
          # Nicht gebrauchte Zusatzprogramme weglassen (nur llama-server wird benutzt).
          find mac-bundle/llama -maxdepth 1 -type f -perm +111 ! -name "*.dylib" ! -name llama-server -delete
          chmod +x mac-bundle/llama/llama-server
          echo "$LLAMA_CPP_TAG" > mac-bundle/llama/VERSION
          ls -la mac-bundle/llama | head -30
      - run: npm ci
      - run: npm test
      - name: Mac-Programm bauen
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Programm lokal signieren (ohne Entwicklerkonto) und DMG erstellen
        run: |
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          echo "App: $APP"
          mkdir -p "$APP/Contents/Resources"
          rm -rf "$APP/Contents/Resources/llama" "$APP/Contents/Resources/ptts"
          cp -a mac-bundle/llama "$APP/Contents/Resources/llama"
          cp -a mac-bundle/ptts "$APP/Contents/Resources/ptts"
          test -x "$APP/Contents/Resources/llama/llama-server"
          test -x "$APP/Contents/Resources/ptts/ptts"
          # Lose Programme und Bibliotheken zuerst, dann das ganze Programm (ad-hoc, "-").
          find "$APP/Contents/Resources" -type f \( -name "*.dylib" -o -name "*.node" -o -perm +111 \) -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then codesign --force -s - "$f" || true; fi
          done
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP" && echo "Signatur ok"
          V="$(node -p "require('./package.json').version")"
          mkdir -p dmg-src
          cp -R "$APP" dmg-src/
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname "FA KI Desktop" -srcfolder dmg-src -ov -format UDZO "dist/FA-KI-Desktop-$V-mac-arm64.dmg"
          ls -la dist/*.dmg
      - name: App-Start prüfen (Fenster geht auf)
        run: |
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          EXE="$APP/Contents/MacOS/$(basename "$APP" .app)"
          R="$RUNNER_TEMP/smoke.txt"; rm -f "$R"
          FA_SMOKE="$R" perl -e 'alarm 120; exec @ARGV' "$EXE" || true
          cat "$R" || true
          grep -q FA_SMOKE_OK "$R"
      - name: Version ermitteln
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Mac-Version als Prerelease bereitstellen
        if: github.ref != 'refs/heads/main'
        run: |
          V="${{ steps.ver.outputs.v }}"
          F="dist/FA-KI-Desktop-$V-mac-arm64.dmg"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          gh release create "v$V-test" --prerelease --target "$SHA" --title "FA KI Desktop $V (Testversion)" --notes "Testversion aus einem Pull Request." >/dev/null 2>&1 || true
          gh release upload "v$V-test" "$F" --clobber
      - name: Mac-Version ins Release legen
        if: github.ref == 'refs/heads/main'
        run: |
          V="${{ steps.ver.outputs.v }}"
          F="dist/FA-KI-Desktop-$V-mac-arm64.dmg"
          gh release create "v$V" --target "${{ github.sha }}" --title "FA KI Desktop $V" --notes "Installationsprogramme für Windows und Mac." >/dev/null 2>&1 || true
          gh release upload "v$V" "$F" || echo "::warning::$F ist in Release v$V schon vorhanden."

  # Prüft Phonon und Voxtral mit den echten Programmen auf Windows und Mac (blockiert die Installer nicht).
  # Phonon spricht einen Satz (freies Modell phonon-31m-en, gleicher Aufbau), Voxtral schreibt ihn wieder als Text.
  sprachtest:
    name: Sprachtest Phonon + Voxtral (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    continue-on-error: true
    env:
      LLAMA_CPP_TAG: b12530
      PTTS_TAG: v0.7.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Programme laden (ptts, llama-server)
        shell: bash
        run: |
          mkdir -p dl x
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release download "$PTTS_TAG" --repo gradium-ai/xn-ptts --pattern "ptts-*-x86_64-pc-windows-msvc.zip" --dir dl
            gh release download "$LLAMA_CPP_TAG" --repo ggml-org/llama.cpp --pattern "llama-*-bin-win-vulkan-x64.zip" --dir dl
            for f in dl/*.zip; do 7z x -y "$f" -ox > /dev/null; done
            echo "PTTS=$(find x -name ptts.exe | head -1)" >> "$GITHUB_ENV"
            echo "LLAMA=$(find x -name llama-server.exe | head -1)" >> "$GITHUB_ENV"
          else
            gh release download "$PTTS_TAG" --repo gradium-ai/xn-ptts --pattern "ptts-*-aarch64-apple-darwin.tar.gz" --dir dl
            gh release download "$LLAMA_CPP_TAG" --repo ggml-org/llama.cpp --pattern "llama-*-bin-macos-arm64.*" --dir dl
            for f in dl/*; do case "$f" in *.zip) unzip -q -o "$f" -d x ;; *.tar.gz|*.tgz) tar -xzf "$f" -C x ;; esac; done
            echo "PTTS=$(find x -type f -name ptts | head -1)" >> "$GITHUB_ENV"
            echo "LLAMA=$(find x -type f -name llama-server | head -1)" >> "$GITHUB_ENV"
          fi
      - name: Phonon und Voxtral ausprobieren
        shell: bash
        run: node scripts/voice-probe.js "$PTTS" "$LLAMA" probe-work
