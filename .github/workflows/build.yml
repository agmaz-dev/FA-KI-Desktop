name: Windows-Installer bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Version ermitteln
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}
          path: dist/FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}.exe
          if-no-files-found: error
      - name: Release erstellen oder aktualisieren
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          F="dist/FA-KI-Desktop-Setup-$V.exe"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$F" --clobber
          else
            gh release create "v$V" "$F" --target "${{ github.sha }}" --title "FA KI Desktop $V" --notes "Installationsprogramm für Windows."
          fi
