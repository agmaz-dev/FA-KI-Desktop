name: Windows-Installer bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Version ermitteln
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}
          path: dist/FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}.exe
          if-no-files-found: error
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/FA-KI-Desktop-Setup-${{ steps.ver.outputs.v }}.exe" --title "FA KI Desktop ${{ steps.ver.outputs.v }}" --notes "Installationsprogramm für Windows." 
